[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prosopo-gw-atelier"
version = "0.1.0"
description = "Atelier local de nettoyage de bases généalogiques GeneWeb (.gw) : lieux d'abord, sortie en pivot importable"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Guillaume Cayeux", email = "guillaume.cayeux@relais4x100a2.fr"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Sociology :: Genealogy",
]
dependencies = [
    "geneweb-py>=0.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.5",
    "platformdirs>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
prosopo-gw-atelier = "prosopo_gw_atelier.cli:main"

[dependency-groups]
dev = ["prosopo-gw-atelier[dev]"]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["prosopo_gw_atelier*"]

[tool.setuptools.package-data]
"prosopo_gw_atelier" = [
    "py.typed",
    "refdata/data/*",
    "store/schema.sql",
    "export/LISEZMOI.txt",
    "web/static/*",
    "web/static/vendor/*",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# geneweb-py is installed as an editable workspace member, which mypy does not
# resolve through its .pth file: point at its sources and do not report its errors.
mypy_path = "$MYPY_CONFIG_FILE_DIR/../core/src"

[[tool.mypy.overrides]]
module = "geneweb_py.*"
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "--strict-config", "--tb=short"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".eggs", ".git", ".mypy_cache", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E203"]
extend-ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["prosopo_gw_atelier"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
