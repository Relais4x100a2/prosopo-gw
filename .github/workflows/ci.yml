name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff, mypy, lock)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --frozen

      - name: Lockfile is up to date
        run: uv lock --check

      - name: Ruff lint
        run: uv run --package geneweb-py ruff check core/src core/tests core/tools --ignore E501 --output-format=github

      - name: Ruff format
        run: uv run --package geneweb-py ruff format --check core/src core/tests core/tools

      - name: Mypy (ensemble de core)
        run: uv run --package geneweb-py mypy core/src/geneweb_py

  secrets:
    name: Secrets (gitleaks, historique complet)
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (binaire épinglé, checksum vérifié)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && sha256sum --ignore-missing -c checksums.txt)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan de l'historique (valeurs masquées)
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  tests:
    name: Tests core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --frozen

      - name: Tests with coverage (seuil 80 %)
        run: |
          uv run --package geneweb-py --with pytest-xdist python -m pytest core \
            -n auto \
            --cov=core/src/geneweb_py \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Archive coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

  docker-build:
    name: Build image Docker (app)
    runs-on: ubuntu-24.04
    needs: [lint, tests]
    steps:
      - uses: actions/checkout@v7

      - name: Build (contexte = racine du monorepo, sans push)
        run: docker build -f app/docker/geneweb-app/Dockerfile -t prosopo-gw-app:ci .

      - name: Import smoke test
        run: |
          docker run --rm prosopo-gw-app:ci python -c \
            "import geneweb_py; from src.pevt_extractor import PEVTExtractor; print('import ok')"
