name: Release

# Tag core-vX.Y.Z   -> publishes geneweb-py
# Tag atelier-vX.Y.Z -> publishes prosopo-gw-atelier
# Trusted publishing (OIDC): no token or secret is stored in the repository.
on:
  push:
    tags:
      - "core-v*"
      - "atelier-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: Select the package from the tag prefix
        id: pkg
        run: |
          case "$GITHUB_REF_NAME" in
            core-v*)    echo "name=geneweb-py" >> "$GITHUB_OUTPUT"
                        echo "version=${GITHUB_REF_NAME#core-v}" >> "$GITHUB_OUTPUT" ;;
            atelier-v*) echo "name=prosopo-gw-atelier" >> "$GITHUB_OUTPUT"
                        echo "version=${GITHUB_REF_NAME#atelier-v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac

      - name: Build
        run: uv build --package "${{ steps.pkg.outputs.name }}" --out-dir dist

      - name: Tag version matches the built version
        run: |
          set -eu
          shopt -s nullglob
          files=(dist/*.whl)
          [ "${#files[@]}" -eq 1 ] || { echo "Expected exactly one wheel" >&2; exit 1; }
          wheel=$(basename "${files[0]}")
          built=$(echo "$wheel" | cut -d- -f2)
          expected="${{ steps.pkg.outputs.version }}"
          if [ "$built" != "$expected" ]; then
            echo "Tag version $expected differs from package version $built" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
